<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Cursor Michi Coffee: flecha redondita rosada con chocolate derretido en la punta -->
  <defs>
    <path id="flecha" d="M5.2 2.6C3.9 1.7 2.6 2.4 2.6 4v20.3c0 1.7 1.9 2.5 3.1 1.4l4.4-4 3.4 7.2c.6 1.2 2 1.7 3.2 1.1l1.6-.8c1.2-.6 1.7-2 1.1-3.2l-3.3-7 5.9-.4c1.6-.1 2.3-2 1.1-3.1z"/>
    <clipPath id="recorte"><use href="#flecha"/></clipPath>
  </defs>
  <!-- sombra suave para que se vea sobre fondos rosados -->
  <use href="#flecha" fill="#4A231E" opacity="0.25" transform="translate(1 1.2)"/>
  <!-- cuerpo rosado -->
  <use href="#flecha" fill="#EF7FA8"/>
  <!-- brillo -->
  <path d="M5.4 6.5v12" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.55" clip-path="url(#recorte)"/>
  <!-- chocolate derretido sobre la punta, con gotitas -->
  <path clip-path="url(#recorte)" fill="#4A231E"
        d="M0 0h32v9.2c-1.3 0-1.9.6-2.2 1.7-.4 1.4-1 2-1.8 2s-1.3-.7-1.4-1.9c-.1-1-.8-1.6-1.8-1.6-1.1 0-1.7.7-1.8 2.3-.1 2.6-.8 3.9-1.9 3.9-1.2 0-1.8-1.3-1.9-3.7-.1-1.6-.9-2.4-2.1-2.4-1 0-1.6.6-1.8 1.8-.2 1.3-.8 2-1.6 2-.9 0-1.4-.7-1.6-2.1-.2-1.3-.8-1.9-1.8-1.9-.9 0-1.4.6-1.6 1.7-.2 1.1-.6 1.7-1.3 1.7S1.5 13.6 1.3 12.6C1.1 11.4.7 10.6 0 10.3z"/>
  <!-- brillito del chocolate -->
  <path d="M4.4 5.6c.3-.9 1-1.3 1.8-.8" stroke="#8B5A4E" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- borde blanco -->
  <use href="#flecha" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
